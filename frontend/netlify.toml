[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the hosted backend (Railway). Must come BEFORE the SPA
# fallback rule — Netlify matches redirects in order.
[[redirects]]
  from = "/api/*"
  to = "https://diplomatic-contentment-production-ae41.up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
